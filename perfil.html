<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-NET | Mercado de Marcos</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div id="main-profile-screen" class="profile-container">
        <div class="social-profile-header">
            <!-- Contenedor del Avatar + Marco -->
            <div class="social-avatar-container" id="avatar-container-wrapper">
                <img src="" id="foto-avatar" class="social-avatar-img" alt="Avatar">
                <!-- Capa del marco que se inyecta dinámicamente -->
                <div id="div-marco-custom" class="avatar-marco-dinamico"></div>
            </div>
            
            <h1 id="display-username">Usuario</h1>
            <button class="btn-mercado" onclick="abrirMercado()">TIENDA DE MARCOS</button>
        </div>
    </div>

    <!-- MODAL MERCADO INTEGRADO -->
    <div id="modal-mercado" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Mercado de Creadores</h3>
            <div class="tab-container">
                <button onclick="cambiarSeccion('comprar')">Comprar</button>
                <button onclick="cambiarSeccion('crear')">Crear Marco</button>
            </div>

            <!-- Sección de Compra -->
            <div id="seccion-comprar" class="marcos-grid"></div>

            <!-- Sección de Creación -->
            <div id="seccion-crear" class="hidden">
                <input type="file" id="upload-marco" accept="image/png, image/gif" onchange="previewMarco(event)">
                <div id="preview-marco-nuevo" class="marco-preview-box"></div>
                <button class="btn-publicar" onclick="publicarMarco()">Publicar Marco</button>
            </div>
            
            <button class="btn-cerrar" onclick="document.getElementById('modal-mercado').classList.add('hidden')">Cerrar</button>
        </div>
    </div>

    <script>
        // Al cargar la página, recuperar marco equipado
        window.onload = function() {
            const user = localStorage.getItem('znet_sesion_activa');
            if(user) {
                const marco = localStorage.getItem(`znet_marco_custom_${user}`);
                if(marco) document.getElementById('div-marco-custom').style.backgroundImage = `url(${marco})`;
            }
        }

        function abrirMercado() {
            document.getElementById('modal-mercado').classList.remove('hidden');
            renderizarMercado();
        }

        function cambiarSeccion(tipo) {
            document.getElementById('seccion-comprar').classList.toggle('hidden', tipo !== 'comprar');
            document.getElementById('seccion-crear').classList.toggle('hidden', tipo !== 'crear');
        }

        function previewMarco(event) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview-marco-nuevo').style.backgroundImage = `url(${e.target.result})`;
                window.tempMarco = e.target.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        function publicarMarco() {
            if(!window.tempMarco) return alert("Sube una imagen primero");
            let mercado = JSON.parse(localStorage.getItem('znet_mercado') || "[]");
            mercado.push({ data: window.tempMarco, autor: localStorage.getItem('znet_sesion_activa') });
            localStorage.setItem('znet_mercado', JSON.stringify(mercado));
            alert("¡Marco publicado en la tienda!");
            renderizarMercado();
        }

        function renderizarMercado() {
            const cont = document.getElementById('seccion-comprar');
            const mercado = JSON.parse(localStorage.getItem('znet_mercado') || "[]");
            cont.innerHTML = mercado.map(m => `
                <div class="market-item" onclick="equiparMarco('${m.data}')">
                    <div style="background-image:url(${m.data})"></div>
                    <small>Autor: ${m.autor}</small>
                </div>
            `).join('');
        }

        function equiparMarco(data) {
            const user = localStorage.getItem('znet_sesion_activa');
            localStorage.setItem(`znet_marco_custom_${user}`, data);
            document.getElementById('div-marco-custom').style.backgroundImage = `url(${data})`;
            alert("¡Marco equipado!");
        }
    </script>
</body>
</html>
