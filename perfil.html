<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Z-Anime</title>
    <link rel="stylesheet" href="comunidad.css"> <link rel="stylesheet" href="perfil.css">    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>

    <main class="profile-container">
        <section class="profile-header">
            <h1 class="profile-username">Yuki <span class="neon-dot">.</span></h1>
            <button class="btn-edit-profile">
                <span class="material-icons-round">edit</span> Editar
            </button>
        </section>

        <section class="card-showcase-section">
            <div class="invocador-tag">INVOCADOR</div>
            <div class="anime-card-epic">
                <div class="card-glow-effect"></div>
                <div class="epic-badge">ÉPICO</div>
                
                <div class="card-art-wrapper">
                    <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400" alt="Molly Art" class="card-illustration">
                    <div class="card-titles">
                        <h2 class="card-main-title">Molly, Guardiana del Bosque Divino</h2>
                        <h3 class="card-sub-title">Molly, Estrella de las Arenas</h3>
                    </div>
                </div>
            </div>
        </section>

        <section class="stats-section">
            <h3 class="section-title"><span class="material-icons-round">bolt</span> Mis Estadísticas RPG:</h3>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="material-icons-round icon-rango">workspace_premium</span>
                    <span class="stat-label">Rango Cuenta</span>
                    <span class="stat-value neon-cyan-text">45</span>
                </div>
                <div class="stat-box">
                    <span class="material-icons-round icon-coleccion">auto_stories</span>
                    <span class="stat-label">Colección Única</span>
                    <span class="stat-value neon-magenta-text">1 / 12</span>
                </div>
                <div class="stat-box">
                    <span class="material-icons-round icon-alma">local_fire_department</span>
                    <span class="stat-label">Puntos de Alma</span>
                    <span class="stat-value neon-gold-text">3861</span>
                </div>
            </div>
        </section>

        <section class="album-section">
            <div class="album-meta">
                <span>Completado del Álbum</span>
                <span class="neon-cyan-text">8.33 %</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: 8.33%;"></div>
            </div>
        </section>

        <section class="action-section">
            <button class="btn-dungeon-rpg">
                <span class="material-icons-round">crossed_swords</span> Entrar a Mazmorra (+PA)
            </button>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-btn"><span class="material-icons-round">home</span></a>
        <button class="nav-btn"><span class="material-icons-round">explore</span></button>
        <button class="nav-btn btn-add"><span class="material-icons-round">add</span></button>
        <button class="nav-btn"><span class="material-icons-round">forum</span></button>
        <a href="perfil.html" class="nav-btn active"><span class="material-icons-round">person</span></a>
    </nav>

</body>
</html>
