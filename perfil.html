<div class="profile-container">

    <div class="profile-header">
        <h1 class="profile-username">
            Yuki <span class="neon-dot">.</span>
            <span class="verified-badge">✔</span> 
        </h1>
        <button class="btn-edit-profile">Editar</button>
    </div>

    <div class="card-showcase-section">
        <span class="invocador-tag">MARCO EQUIPADO</span>
        <div class="anime-card-epic frame-neon-cyan" id="main-card">
            <div class="epic-badge">ÉPICO</div>
            <div class="card-art-wrapper">
                <img src="Molly_Foto.jpg" class="card-illustration" alt="Molly">
                <div class="card-titles">
                    <div class="card-main-title">Molly, Guardiana del Bosque Divino</div>
                    <div class="card-sub-title">Molly, Estrella de las Arenas</div>
                </div>
            </div>
        </div>
    </div>

    <div class="stats-section">
        <h2 class="section-title">Colección de <span>Marcos</span></h2>
        <div class="frames-grid">
            
            <div class="frame-box active" onclick="cambiarMarco('cyan')">
                <div class="frame-preview-circle preview-cyan">O</div>
                <div class="frame-label">Cian Neón</div>
                <div class="frame-status status-equipped">Equipado</div>
            </div>

            <div class="frame-box" onclick="cambiarMarco('magenta')">
                <div class="frame-preview-circle preview-magenta">O</div>
                <div class="frame-label">Magma Pink</div>
                <div class="frame-status status-unlocked">Desbloqueado</div>
            </div>

            <div class="frame-box" onclick="cambiarMarco('default')">
                <div class="frame-preview-circle preview-default">O</div>
                <div class="frame-label">Por Defecto</div>
                <div class="frame-status status-unlocked">Desbloqueado</div>
            </div>

        </div>
    </div>

    <div class="collection-progress-section">
        <div class="progress-meta">
            <span>Marcos Obtenidos</span>
            <span>1 / 3</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <button class="btn-get-frames">Obtener más marcos</button>

</div>
