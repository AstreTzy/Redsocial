<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-NET - Perfil</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="profile-container">
        
        <!-- PANTALLA DE ACCESO / LOGIN -->
        <div id="auth-screen" class="auth-card">
            <h1 class="auth-logo">Z<span>·</span>NET</h1>
            
            <div class="auth-tabs">
                <button class="auth-tab active">Entrar</button>
                <button class="auth-tab">Registrarse</button>
            </div>

            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="login-user" placeholder="Tu usuario">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="login-pass" placeholder="••••••••">
            </div>
            <button class="btn-auth-submit" onclick="iniciarSesion()">Entrar</button>
        </div>


        <!-- PANTALLA DE PERFIL PRINCIPAL -->
        <div id="main-profile-screen" class="hidden">
            
            <!-- Banner superior oscuro con corte -->
            <div class="profile-header-banner">
                <div class="top-nav-row">
                    <button class="back-btn" onclick="window.location.href='index.html'">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <span class="banner-title">Profile</span>
                    <button class="logout-mini-btn" onclick="cerrarSesion()" title="Salir">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Avatar flotante centrado en el corte -->
            <div class="profile-avatar-container">
                <div class="avatar-border">
                    <img src="1000263118.jpg" alt="Avatar">
                </div>
                <div class="badge-online">PRO</div>
            </div>

            <!-- Información del usuario -->
            <div class="profile-info-section">
                <h1 class="profile-real-name">Anna Kendrick</h1>
                <p class="profile-bio-text">Vlogger & Fashion Lover</p>

                <!-- Botones de acción (Message / Follow) -->
                <div class="profile-actions-buttons">
                    <button class="btn-action-outline">MESSAGE</button>
                    <button class="btn-action-dark">FOLLOW</button>
                </div>

                <!-- Estadísticas -->
                <div class="profile-stats-row">
                    <div class="stat-box">
                        <span class="stat-num">252k</span>
                        <span class="stat-txt">Followers</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num">378</span>
                        <span class="stat-txt">Following</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num">115</span>
                        <span class="stat-txt">Posts</span>
                    </div>
                </div>
            </div>

            <!-- Pestañas de navegación de contenido -->
            <div class="profile-tabs-nav">
                <span class="tab-item active">PHOTOS</span>
                <span class="tab-item">VIDEOS</span>
                <span class="tab-item">POSTS</span>
                <span class="tab-item">ABOUT</span>
            </div>

            <!-- Cuadrícula de fotos inferior -->
            <div class="profile-photos-grid">
                <div class="grid-card"><img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500" alt="Post"></div>
                <div class="grid-card"><img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500" alt="Post"></div>
                <div class="grid-card"><img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500" alt="Post"></div>
                <div class="grid-card"><img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500" alt="Post"></div>
            </div>

        </div>

    </div>

    <script>
        function iniciarSesion() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-profile-screen').classList.remove('hidden');
        }

        function cerrarSesion() {
            document.getElementById('main-profile-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
