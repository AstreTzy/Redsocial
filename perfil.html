<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-NET - Perfil</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="profile-container">
        
        <!-- PANTALLA DE ACCESO / LOGIN -->
        <div id="auth-screen" class="auth-card">
            <h1 class="auth-logo">Z<span>·</span>NET</h1>
            
            <div class="auth-tabs">
                <button class="auth-tab active">Entrar</button>
                <button class="auth-tab">Registrarse</button>
            </div>

            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="login-user" placeholder="Tu usuario">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="login-pass" placeholder="••••••••">
            </div>
            <button class="btn-auth-submit" onclick="iniciarSesion()">Entrar</button>
        </div>


        <!-- PANTALLA DE PERFIL PRINCIPAL (Estilo Inmersivo Centrado) -->
        <div id="main-profile-screen" class="hidden">
            
            <!-- Banner superior con foto de fondo difuminada -->
            <div class="profile-hero-banner">
                <img src="1000263118.jpg" class="banner-bg-img" alt="Banner Background">
                
                <div class="profile-top-bar">
                    <button class="back-btn" onclick="window.location.href='index.html'">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="menu-dots-btn">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                </div>

                <!-- Avatar centralizado flotando sobre el banner -->
                <div class="profile-avatar-center-wrapper">
                    <div class="profile-avatar-ring">
                        <img src="1000263118.jpg" alt="Avatar">
                    </div>
                </div>
            </div>

            <!-- Información del usuario centralizada -->
            <div class="profile-info-center">
                <h1 class="profile-name-center">Sophia</h1>
                <div class="profile-status-row">
                    <span class="status-dot"></span>
                    <span class="status-text">Online</span>
                </div>
            </div>

            <!-- Botones de acción tipo píldora -->
            <div class="profile-pills-row">
                <button class="pill-btn pill-dark">
                    <i class="fas fa-bolt"></i> Exclusive Chat
                </button>
                <button class="pill-btn pill-light">
                    <i class="fas fa-smile"></i> Emotional Support
                </button>
            </div>

            <!-- Separador / Sección inferior -->
            <div class="section-divider">
                <span>Today</span>
            </div>

            <!-- Contenido inferior -->
            <div class="profile-feed-placeholder">
                <button class="btn-logout-inline" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>

        </div>

    </div>

    <script>
        function iniciarSesion() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-profile-screen').classList.remove('hidden');
        }

        function cerrarSesion() {
            document.getElementById('main-profile-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
