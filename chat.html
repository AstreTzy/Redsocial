<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - Z-Anime</title>
    <link rel="stylesheet" href="comunidad.css">
    <link rel="stylesheet" href="chat.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>

    <header class="anime-header">
        <div class="logo">Z<span>·</span>CHATS</div>
        <div class="chat-search">
            <span class="material-icons-round">search</span>
            <input type="text" placeholder="Buscar amigos o salas de rol...">
        </div>
    </header>

    <main class="chat-list-container">
        
        <div class="chat-item unread">
            <div class="avatar-container elite-border">
                <img src="https://i.pravatar.cc/100?img=5" alt="User">
            </div>
            <div class="chat-info">
                <div class="chat-name-row">
                    <span class="chat-name">Kirito_Rp</span>
                    <span class="chat-time">10:45 AM</span>
                </div>
                <p class="chat-last-message">[Acción] *Desenvaino mi espada negra mientras observo el horizonte esperando tu respuesta...*</p>
            </div>
            <div class="unread-badge">1</div>
        </div>

        <div class="chat-item">
            <div class="avatar-container community-border">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=100" alt="Group">
            </div>
            <div class="chat-info">
                <div class="chat-name-row">
                    <span class="chat-name">Comunidad: #Fanarts_Generales</span>
                    <span class="chat-time">Ayer</span>
                </div>
                <p class="chat-last-message"><span>Rei_Evangelion:</span> ¡Miren este dibujo que terminé anoche!</p>
            </div>
        </div>

    </main>

        <nav class="bottom-nav">
        <a href="index.html" class="nav-btn" id="nav-home">
            <span class="material-icons-round">home</span>
        </a>
        
        <a href="#" class="nav-btn" id="nav-explore">
            <span class="material-icons-round">explore</span>
        </a>
        
        <button class="nav-btn btn-add">
            <span class="material-icons-round">add</span>
        </button>
        
        <a href="chat.html" class="nav-btn" id="nav-chat">
            <span class="material-icons-round">forum</span>
        </a>
        
        <a href="perfil.html" class="nav-btn" id="nav-profile">
            <span class="material-icons-round">person</span>
        </a>
    </nav>


</body>
</html>
